<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DopaMind — Informations légales</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ECE5D8; color: #2C2A27; padding: 24px; }
  .card { background: #ECE5D8; border-radius: 24px; padding: 40px 32px; max-width: 420px; width: 100%; text-align: center;
    box-shadow: 8px 8px 20px rgba(176,156,124,.5), -8px -8px 20px rgba(255,255,255,.9); }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 6px; }
  p { color: #8A7F6C; font-size: 14px; margin-bottom: 26px; }
  a.btn { display: block; text-decoration: none; color: #2C2A27; font-weight: 700; font-size: 16px;
    padding: 16px; border-radius: 16px; margin-bottom: 14px; background: #ECE5D8;
    box-shadow: 5px 5px 12px rgba(176,156,124,.5), -5px -5px 12px rgba(255,255,255,.9); }
  a.btn:active { box-shadow: inset 4px 4px 9px rgba(176,156,124,.5), inset -4px -4px 9px rgba(255,255,255,.9); }
  @media (prefers-color-scheme: dark) {
    body { background: #17141F; color: #ECE9F6; }
    .card { background: #17141F; box-shadow: 8px 8px 20px rgba(0,0,0,.55), -8px -8px 20px rgba(255,255,255,.04); }
    p { color: #928BAC; }
    a.btn { background: #17141F; color: #ECE9F6; box-shadow: 5px 5px 12px rgba(0,0,0,.55), -5px -5px 12px rgba(255,255,255,.04); }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>DopaMind</h1>
    <p>Informations légales / Legal</p>
    <a class="btn" href="privacy.html">Politique de confidentialité · Privacy Policy</a>
    <a class="btn" href="terms.html">Conditions d'utilisation · Terms of Use</a>
  </div>
</body>
</html>
